# Pin the lint rule set instead of inheriting ruff's evolving defaults.
#
# Recent ruff releases widened the default rule selection (UP, BLE, S, RUF,
# PLR, I ...), which turned a previously green lint job red overnight on
# unchanged files.  The rule set below is the classic default that this
# codebase was written against: syntax errors, pyflakes, and the pycodestyle
# checks that catch real bugs.  Widen it deliberately, not by ruff upgrade.
line-length = 88
target-version = "py37"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Skill scripts are executed by the DCC host; module imports are deliberately
# deferred into function bodies and normally hoisted by the loader.
"skill/*/scripts/*.py" = ["E402"]
