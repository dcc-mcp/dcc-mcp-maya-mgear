tools:
- name: inspect_mgear_environment
  description: Read mGear availability, version, key modules, UPV math-node dependency status, and environment diagnostics.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: true
    idempotent_hint: true
  group: mgear
  input_schema:
    type: object
    properties:
      verbose:
        type: boolean
        default: false
        description: Include detailed module paths, UPV math-node status, and extra diagnostic info.

- name: list_shifter_components
  description: List available Shifter component types and guides in the current scene.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: true
    idempotent_hint: true
  group: mgear
  input_schema:
    type: object
    properties:
      include_guides:
        type: boolean
        default: true
        description: Include existing guides from the current scene.
      component_type:
        type: string
        description: Filter by specific component type name.

- name: create_shifter_guide_from_template
  description: Create a Shifter guide from a named template at a specified location.
  execution: sync
  affinity: main
  group: mgear
  input_schema:
    type: object
    required:
    - guide_name
    - template
    properties:
      guide_name:
        type: string
        description: Name for the new guide.
      template:
        type: string
        description: Component template name (e.g. "arm_2jnt_01", "leg_2jnt_01"). Use list_shifter_components to see available types.
      position:
        type: array
        items:
          type: number
        minItems: 3
        maxItems: 3
        description: World-space position [x, y, z].
      parent_guide:
        type: string
        description: Optional parent guide name for hierarchy.
      parameters:
        type: object
        description: Additional template-specific parameters as key-value pairs.

- name: build_shifter_rig
  description: Build a rig from an existing Shifter guide in the scene.
  execution: sync
  affinity: main
  group: mgear
  input_schema:
    type: object
    properties:
      guide_name:
        type: string
        description: Name of the guide to build from. Builds whatever is selected if not specified.

- name: export_shifter_rig
  description: >
    Export a built Shifter rig (with its animation) to FBX or Alembic (.abc)
    and report verifiable metrics. Resolves the rig root from an explicit
    name, an explicit node list, or mGear rig-root attributes; creates the
    parent directory when missing; reads the file back and returns byte size
    plus joint / control / mesh / keyframe counts and the exported frame range.
  execution: sync
  affinity: main
  group: mgear
  input_schema:
    type: object
    required:
    - file_path
    properties:
      file_path:
        type: string
        description: >
          Destination file path. Parent directories are created if missing and
          the canonical extension is appended when the path has none.
      file_format:
        type: string
        enum:
        - fbx
        - abc
        description: >
          Export format. fbx uses the fbxmaya plug-in; abc uses AbcExport.
          Omit to infer the format from the file extension (defaults to fbx
          when the extension says nothing).
      rig_root:
        type: string
        description: >
          Name of the built rig root to export. Omit to auto-detect the mGear
          rig root from the scene.
      objects:
        type: array
        items:
          type: string
        minItems: 1
        description: Explicit nodes to export. Takes precedence over rig_root.
      start_frame:
        type: number
        description: Export start frame. Defaults to the timeline start.
      end_frame:
        type: number
        description: Export end frame. Defaults to the timeline end.
      bake_animation:
        type: boolean
        default: true
        description: Bake complex animation into the exported range (FBX only).

- name: export_shifter_guide_template
  description: Export a Shifter guide or component as a reusable template file.
  execution: sync
  affinity: main
  group: mgear
  input_schema:
    type: object
    required:
    - guide_name
    properties:
      guide_name:
        type: string
        description: Name of the guide or component to export.
      output_path:
        type: string
        description: File path for the exported template. Omit to return as base64.
      include_metadata:
        type: boolean
        default: true
        description: Include metadata and annotations in the export.

- name: import_shifter_sample_template
  description: Import an official mGear Shifter sample template (e.g. quadruped.sgt) into the current scene.
  execution: sync
  affinity: main
  group: mgear
  input_schema:
    type: object
    required:
    - template_name
    properties:
      template_name:
        type: string
        description: Name of the sample template to import (e.g. "quadruped.sgt" or "quadruped").
      select_guide:
        type: boolean
        default: true
        description: Select the imported guide root in the Maya viewport after import.
